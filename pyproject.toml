[project]
name = "convert-pa"
version = "1.0.0"
description = "Package to convert between transcription standards"
authors = [
    {name = "Språkbanken", email = "sprakbanken@nb.no"},
]
dependencies = []
requires-python = ">=3.10"
readme = "README.md"
license = {text = "CC0"}

[tool.pdm]
distribution = true

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]
